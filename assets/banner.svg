<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 970 440" width="970" height="440" font-family="'Courier New', Courier, monospace" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#050810"/>
      <stop offset="1" stop-color="#0a1020"/>
    </linearGradient>
    <radialGradient id="glow" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#5b3fd1" stop-opacity="0.35"/>
      <stop offset="1" stop-color="#5b3fd1" stop-opacity="0"/>
    </radialGradient>
    <pattern id="grid" width="24" height="24" patternUnits="userSpaceOnUse">
      <path d="M24 0H0V24" fill="none" stroke="#1b2540" stroke-width="0.5" opacity="0.6"/>
    </pattern>
    <pattern id="dots" width="5" height="5" patternUnits="userSpaceOnUse">
      <circle cx="2.5" cy="2.5" r="1.5" fill="#7b5cff"/>
    </pattern>
    <filter id="neon" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="4" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>

  <!-- background -->
  <rect width="970" height="440" fill="url(#bg)"/>
  <rect width="970" height="440" fill="url(#grid)"/>
  <circle cx="775" cy="240" r="260" fill="url(#glow)"/>

  <!-- top bar -->
  <text x="22" y="28" font-size="12" letter-spacing="4" fill="#7f8db3">SYSTEM ONLINE / LIVING IDENTITY</text>
  <text x="944" y="28" font-size="13" text-anchor="end" fill="#a9b6d9">@rivalhide</text>

  <!-- greeting -->
  <text x="22" y="105" font-size="12" letter-spacing="5" fill="#3f6bd6">HELLO, WORLD. I'M</text>

  <!-- NAME (blinking + glitch) -->
  <g font-size="76" font-weight="bold" letter-spacing="5">
    <!-- glitch layers -->
    <text x="26" y="186" fill="#00e5ff" opacity="0.5">RIVALHIDE
      <animate attributeName="x" values="26;22;30;26;26;26" dur="3s" repeatCount="indefinite"/>
      <animate attributeName="opacity" values="0;0;0.6;0;0;0" dur="3s" repeatCount="indefinite"/>
    </text>
    <text x="18" y="184" fill="#ff2bd6" opacity="0.5">RIVALHIDE
      <animate attributeName="x" values="18;24;14;18;18;18" dur="3s" repeatCount="indefinite"/>
      <animate attributeName="opacity" values="0;0;0.6;0;0;0" dur="3s" repeatCount="indefinite"/>
    </text>
    <!-- main name -->
    <text x="22" y="185" fill="none" stroke="#c9d3f5" stroke-width="1.5" filter="url(#neon)">RIVALHIDE
      <animate attributeName="opacity" values="1;1;1;0.15;1;0.4;1;1" keyTimes="0;0.5;0.6;0.62;0.66;0.7;0.74;1" dur="3s" repeatCount="indefinite"/>
    </text>
    <text x="22" y="185" fill="#7b5cff" fill-opacity="0.25">RIVALHIDE
      <animate attributeName="fill-opacity" values="0.25;0.55;0.25" dur="1.6s" repeatCount="indefinite"/>
    </text>
  </g>
  <!-- cursor -->
  <rect x="520" y="130" width="14" height="58" fill="#00e5ff">
    <animate attributeName="opacity" values="1;1;0;0" keyTimes="0;0.5;0.5;1" dur="1s" repeatCount="indefinite"/>
  </rect>

  <!-- info -->
  <text x="22" y="320" font-size="19" fill="#cfd8f5">Python / JavaScript / Computer Vision</text>
  <text x="22" y="348" font-size="13" fill="#5d6f99">Drones. AI. Algorithms. Built in public.</text>

  <!-- avatar ring -->
  <g transform="translate(775 240)">
    <circle r="190" fill="none" stroke="#1c2a4d" stroke-width="1"/>
    <g>
      <circle r="190" fill="none" stroke="#3f6bd6" stroke-width="2" stroke-dasharray="120 400 60 600" stroke-linecap="round"/>
      <animateTransform attributeName="transform" type="rotate" from="0" to="360" dur="14s" repeatCount="indefinite"/>
    </g>
    <g>
      <circle r="176" fill="none" stroke="#00e5ff" stroke-width="1.5" stroke-dasharray="30 500" stroke-linecap="round"/>
      <animateTransform attributeName="transform" type="rotate" from="360" to="0" dur="9s" repeatCount="indefinite"/>
    </g>
  </g>

  <!-- avatar (pixel figure, blinking) -->
  <g filter="url(#neon)" transform="translate(643 107)">
    <g fill="url(#dots)">
      <rect x="105" y="0"   width="53" height="53"/>   <!-- head -->
      <rect x="0"   y="50"  width="53" height="106"/>  <!-- left arm -->
      <rect x="210" y="50"  width="53" height="106"/>  <!-- right arm -->
      <rect x="50"  y="105" width="53" height="106"/>  <!-- left leg -->
      <rect x="160" y="105" width="53" height="106"/>  <!-- right leg -->
      <rect x="0"   y="212" width="265" height="53"/>  <!-- base -->
    </g>
    <animate attributeName="opacity" values="1;1;0.25;1;1;0.6;1" keyTimes="0;0.4;0.45;0.5;0.8;0.85;1" dur="2.4s" repeatCount="indefinite"/>
  </g>

  <!-- scan line -->
  <rect x="600" y="100" width="350" height="2" fill="#00e5ff" opacity="0.5">
    <animate attributeName="y" values="95;385;95" dur="5s" repeatCount="indefinite"/>
  </rect>

  <!-- bottom bar -->
  <line x1="22" y1="396" x2="944" y2="396" stroke="#1c2a4d"/>
  <circle cx="30" cy="418" r="4" fill="#00ff9d">
    <animate attributeName="opacity" values="1;0.15;1" dur="1.2s" repeatCount="indefinite"/>
  </circle>
  <text x="44" y="422" font-size="12" letter-spacing="3" fill="#7f8db3">STATUS: ONLINE  //  BUILDING IN PUBLIC</text>
</svg>
